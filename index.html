    <script>
      // Set theme before first paint (no flash) and mark JS as available.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        // Dark is the designed default; a visitor's saved choice always wins.
        if (t !== 'light' && t !== 'dark') t = 'dark';
        d.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f4f1ea' : '#0d0d0f');
      })();
    </script>
